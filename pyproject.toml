[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-insight"
version = "0.3.0"
description = "rollout-insight CLI + Cursor Skill wrapper (v0.3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rollout-insight contributors" }]
# CLI 默认零外部依赖；HTTP/JSON 用标准库
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# 安装后生成 `rollout-insight` 可执行入口
rollout-insight = "cli.rollout_insight:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]